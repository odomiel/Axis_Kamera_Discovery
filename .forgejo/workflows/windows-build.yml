# Baut die Windows-.exe von Axis_Kamera_Discovery mit PyInstaller.
# Liegt unter .forgejo/workflows/, damit ein oeffentlicher GitHub-Push-Mirror den
# Push nicht ablehnt (GitHub blockiert .github/workflows/ ohne workflow-Scope);
# Forgejo/Gitea Actions liest .forgejo/workflows/ und benoetigt einen
# registrierten Windows-Runner.
name: Windows Build

on:
  workflow_dispatch:        # manuell ausloesbar
  push:
    tags:
      - "v*"                # bei Versions-Tags automatisch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Abhaengigkeiten installieren
        # --upgrade + Mindestversion: Python 3.14 bringt Tcl/Tk 9 mit; nur ein
        # aktuelles PyInstaller buendelt das Tcl-Datenverzeichnis (_tcl_data)
        # korrekt (aeltere brechen mit "Tcl data directory ... not found" ab).
        run: pip install --upgrade "pyinstaller>=6.11" zeroconf prettytable ifaddr sv-ttk pyzipper

      - name: .exe bauen
        run: pyinstaller --noconfirm Axis_Kamera_Discovery.spec

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Axis_Kamera_Discovery-windows
          path: dist/*.exe
